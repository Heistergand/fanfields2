<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Fan Fields 3 stats admin</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="admin.css">
  <script src="admin.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="favicon.png" alt="" width="28" height="28">
      <span>Fan Fields 3 <em>usage stats</em></span>
    </div>
    <nav id="nav" hidden>
      <span id="whoami" class="muted"></span>
      <button type="button" id="btnPassword" class="ghost">Change password</button>
      <button type="button" id="btnLogout" class="ghost">Log out</button>
    </nav>
  </header>

  <main>
    <section id="loginView" class="card login" hidden>
      <h1>Sign in</h1>
      <form id="loginForm" autocomplete="on">
        <label>User
          <input name="user" autocomplete="username" required>
        </label>
        <label>Password
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <p id="loginError" class="error" hidden></p>
        <button type="submit" class="primary">Sign in</button>
      </form>
    </section>

    <section id="mainView" hidden>
      <div class="filters card">
        <div class="presets" id="presets">
          <button type="button" class="ghost small" data-days="7">7 days</button>
          <button type="button" class="ghost small" data-days="30">30 days</button>
          <button type="button" class="ghost small" data-days="90">90 days</button>
          <button type="button" class="ghost small" data-days="365">1 year</button>
        </div>
        <label>From
          <input id="from" type="date">
        </label>
        <label>To
          <input id="to" type="date">
        </label>
        <label>Faction
          <select id="faction">
            <option value="all">All factions</option>
            <option value="ENL">Enlightened</option>
            <option value="RES">Resistance</option>
          </select>
        </label>
        <label>Region
          <select id="region">
            <option value="all">All regions</option>
          </select>
        </label>
        <button type="button" id="btnApply" class="primary">Apply</button>
      </div>

      <div class="stats" id="stats"></div>

      <div class="card">
        <h2>Active time per day</h2>
        <div class="history" id="history"></div>
      </div>

      <div class="card">
        <h2>By faction</h2>
        <div id="byFaction"></div>
      </div>

      <div class="card">
        <h2>By region</h2>
        <div id="byRegion"></div>
      </div>
    </section>
  </main>

  <dialog id="passwordDialog">
    <form id="passwordForm" method="dialog">
      <h2>Change admin password</h2>
      <label>Current password
        <input name="current" type="password" autocomplete="current-password" required>
      </label>
      <label>New password
        <input name="password" type="password" autocomplete="new-password" minlength="12" required>
      </label>
      <label>Confirm new password
        <input name="confirm" type="password" autocomplete="new-password" minlength="12" required>
      </label>
      <p id="passwordError" class="error" hidden></p>
      <div class="actions">
        <button type="button" class="ghost" data-close>Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
