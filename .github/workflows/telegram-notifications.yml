name: Telegram Notifications

on:
  issues:
    types: [opened, edited, closed]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, edited, closed, reopened]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:

permissions: {}

jobs:
  send_notification:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Never checkout or execute pull request code in this privileged workflow.
      - name: Send Telegram notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          def clip(value, limit):
              value = str(value or "").replace("\r\n", "\n").replace("\r", "\n")
              return value if len(value) <= limit else value[:limit - 1] + "…"

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as file:
              event = json.load(file)

          kind = os.environ["GITHUB_EVENT_NAME"]
          action = clip(event.get("action"), 40)
          actor = clip(event.get("sender", {}).get("login"), 100)
          issue = event.get("issue") or {}
          pr = event.get("pull_request") or {}
          comment = event.get("comment") or {}
          if kind == "issues":
              heading, item, body = "🚨 Issue Notification", issue, issue.get("body")
          elif kind == "issue_comment":
              heading, item, body = "📝 Comment on Issue / PR", issue, comment.get("body")
          elif kind == "pull_request_target":
              heading, item, body = "🚀 Pull Request Notification", pr, pr.get("body")
          elif kind == "pull_request_review_comment":
              heading, item, body = "💬 Comment on Pull Request", pr, comment.get("body")
          elif kind == "workflow_dispatch":
              heading, item, body = "Telegram notification test", {}, "Manual workflow test."
          else:
              sys.exit("Unsupported notification event.")

          lines = [heading, f"Actor: {actor} | Event: {action or kind}"]
          if item.get("html_url"):
              lines.append(clip(item["html_url"], 300))
          if item.get("title"):
              lines.append("Title: " + clip(item["title"], 300))
          if comment.get("html_url"):
              lines.append("Comment: " + clip(comment["html_url"], 300))
          lines.extend(["", clip(body, 1000)])
          message = "\n".join(lines)

          token = os.environ.get("TELEGRAM_TOKEN", "")
          recipients = os.environ.get("TELEGRAM_TO", "").split(",")
          recipients = [recipient.strip() for recipient in recipients if recipient.strip()]
          if not re.fullmatch(r"[0-9]+:[A-Za-z0-9_-]+", token) or not recipients:
              sys.exit("Telegram credentials unavailable or invalid for this event.")

          # No redirects: never forward credentials to a different endpoint.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())
          failed = False
          for recipient in recipients:
              payload = json.dumps({
                  "chat_id": recipient,
                  "text": message,
                  "link_preview_options": {"is_disabled": True},
              }).encode("utf-8")
              request = urllib.request.Request(
                  "https://api.telegram.org/bot" + token + "/sendMessage",
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with opener.open(request, timeout=15) as response:
                      if not json.load(response).get("ok"):
                          failed = True
              except urllib.error.HTTPError as error:
                  print(f"Telegram API returned HTTP {error.code}.")
                  failed = True
              except Exception:
                  print("Telegram request failed.")
                  failed = True
          if failed:
              sys.exit("One or more Telegram notifications failed.")
          print("Telegram notification sent.")
          PY
